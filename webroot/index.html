<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <script>(function(){var t=localStorage.getItem('mca_theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dog Walk Board</title>
  <link rel="stylesheet" href="assets/css/style.css?v=1">
</head>
<body data-i18n-title="index.title">
  <header class="app-header">
    <div class="header-text">
      <h1 data-i18n="index.h1">Dog Walk Board</h1>
      <p class="subtitle" data-i18n-board="index.subtitle"></p>
    </div>
    <div class="header-buttons">
      <button id="lang-toggle-btn" class="theme-toggle" type="button" aria-label="Change language">EN</button>
      <button id="theme-toggle-btn" class="theme-toggle" type="button" data-i18n-attr="aria-label:theme.toggleAriaLabel">🌙</button>
    </div>
  </header>
  <main>
    <div id="step-who" class="card">
      <h2 data-i18n="index.whoHeading">Who are you?</h2>
      <p class="meta-line" data-i18n="index.whoHint"></p>
      <div id="who-buttons" class="btn-row">
        <p data-i18n="common.loading"></p>
      </div>
    </div>

    <div id="step-action" class="card" style="display:none">
      <h2 id="action-greeting">Hi!</h2>
      <p class="meta-line" data-i18n="index.actionHint"></p>
      <div class="btn-row">
        <a id="action-walk" class="btn primary" href="#" data-i18n="index.actionWalk"></a>
        <a id="action-schedule" class="btn" href="#" data-i18n="index.actionSchedule"></a>
      </div>
      <div class="btn-row">
        <button id="change-user-btn" type="button" data-i18n="index.changeUser"></button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="index.readonlyHeading"></h2>
      <p class="meta-line" data-i18n="index.readonlyHint"></p>
      <nav class="app-nav">
        <a href="board.html" data-i18n="index.navBoard"></a>
        <a href="schedules.html" data-i18n="index.navSchedules"></a>
      </nav>
    </div>
  </main>
  <footer class="app-footer" data-i18n="index.footer"></footer>

  <script src="assets/js/config.js?v=1"></script>
  <script src="assets/js/i18n.js?v=1"></script>
  <script src="assets/js/common.js?v=1"></script>
  <script src="assets/js/index.js?v=1"></script>
</body>
</html>
